name: Supabase

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local
      - run: test -d supabase/migrations
      - run: supabase test db
      - if: always()
        run: supabase stop
