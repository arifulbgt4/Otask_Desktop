name: Web

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @otask/web build
      - run: pnpm --filter @otask/web typecheck
      - run: pnpm --filter @otask/web lint
      - run: pnpm --filter @otask/web test
